<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Asante Trade icon">
  <defs>
    <linearGradient id="at-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C766"/>
      <stop offset="100%" stop-color="#C8901E"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#12141C"/>

  <!-- network lines forming an "A" / trade route -->
  <g stroke="url(#at-gold)" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M64 28 L30 96"/>
    <path d="M64 28 L98 96"/>
    <path d="M44 68 L84 68"/>
  </g>

  <!-- node points: apex (agent), left (customer), right (agent), crossbar accent (transaction) -->
  <circle cx="64" cy="28" r="8" fill="url(#at-gold)"/>
  <circle cx="30" cy="96" r="8" fill="url(#at-gold)"/>
  <circle cx="98" cy="96" r="8" fill="url(#at-gold)"/>
  <circle cx="64" cy="68" r="5" fill="#2FD1C5"/>
</svg>
